# nginx SOLO para desarrollo local — replica cómo se sirve /media/ en
# producción (Contabo), donde nginx sí soporta Range requests y Starlette
# (FastAPI) no. Sin esto, los segmentos HLS (.ts) se corrompen en el
# reproductor nativo del celular cuando pide bytes parciales y el backend
# ignora el pedido devolviendo el archivo entero igual.
server {
    listen 80;

    client_max_body_size 100m;

    # Los archivos viven en el bucket de MinIO con la misma ruta que tenían
    # en disco: /media/marketplace/... -> marketplace-media/marketplace/...
    # MinIO soporta Range nativamente, así que el seek del video sigue bien.
    location /media/ {
        proxy_pass http://minio:9000/marketplace-media/;
        proxy_http_version 1.1;
        proxy_set_header Host minio:9000;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://marketplace-api:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300;
        proxy_connect_timeout 60;
    }
}
