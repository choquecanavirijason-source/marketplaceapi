services:
  marketplace-api:
    build: .
    container_name: marketplace-api
    ports:
      - "8001:8001"
    env_file: .env
    volumes:
      - ./media:/app/media
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # SOLO desarrollo local — replica cómo producción sirve /media/ con soporte
  # de Range real (nginx), que Starlette/FastAPI no tiene. Ver nginx.local.conf.
  nginx-local:
    image: nginx:alpine
    container_name: marketplace-nginx-local
    ports:
      - "8003:80"
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./media:/media:ro
    depends_on:
      - marketplace-api
    restart: unless-stopped
